[package]
name = "capstan"
version = "0.1.0"
edition = "2024"

[dependencies]
cocoa = "0.26.0"
objc = "0.2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "0.7.1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[[test]]
name = "settings-ui"
path = "tests/settings-ui.rs"
harness = false
